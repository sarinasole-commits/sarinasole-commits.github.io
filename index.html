<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Mars 的小站</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f2; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b; --line: #e3e3e0; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --card: #1e1e1e; --text: #f0f0f0; --muted: #9a9a9a; --line: #333333; --accent: #7aa7ff; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 20px 60px; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; text-decoration: none; color: inherit; }
    .card h2 { font-size: 19px; margin-bottom: 4px; }
    .card h2 span { color: var(--accent); float: right; font-weight: normal; }
    .card p { color: var(--muted); font-size: 14px; }
    footer { margin-top: 36px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Mars 的小站</h1>
    <p class="sub">小游戏和教程，都在这里。</p>

    <a class="card" href="./puzzle/">
      <h2>拼图小游戏 <span>→</span></h2>
      <p>上传照片，生成打散拼图，4×4 / 6×6 / 8×8 三档难度。</p>
    </a>

    <a class="card" href="./2048/">
      <h2>2048 <span>→</span></h2>
      <p>滑动合并计分，单文件小游戏，手机上直接玩。</p>
    </a>

    <a class="card" href="./tutorial/">
      <h2>Muse 新手教程 <span>→</span></h2>
      <p>阅读优化与内容补充版。</p>
    </a>

    <footer>Hosted on GitHub Pages</footer>
  </main>
</body>
</html>
