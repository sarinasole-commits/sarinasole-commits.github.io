<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <meta name="x5-orientation" content="portrait" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>拼图小游戏</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f0e8;
      --surface: #fffdf8;
      --surface-2: #ece7dc;
      --ink: #18211f;
      --muted: #65706b;
      --line: #d8d2c7;
      --accent: #087f68;
      --accent-strong: #056653;
      --accent-soft: #d7eee7;
      --grid-faint: rgba(216, 210, 199, .22);
      --tape: rgba(8, 127, 104, .16);
      --selected: #ffca3a;
      --correct: rgba(103, 215, 169, .7);
      --danger: #b24b3d;
      --danger-soft: #eadbd7;
      --button-shadow: #034d40;
      --shadow: 0 18px 50px rgba(42, 49, 44, .12);
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121816;
        --surface: #1b2421;
        --surface-2: #26302c;
        --ink: #edf3ef;
        --muted: #a6b0ab;
        --line: #39433f;
        --accent: #5bc9ad;
        --accent-strong: #77dac2;
        --accent-soft: #203f37;
        --grid-faint: rgba(57, 67, 63, .22);
        --tape: rgba(91, 201, 173, .16);
        --selected: #ffca3a;
        --correct: rgba(103, 215, 169, .7);
        --danger: #ff9b8c;
        --danger-soft: #4c302d;
        --button-shadow: #16372f;
        --shadow: 0 20px 56px rgba(0, 0, 0, .34);
      }
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 23px, var(--grid-faint) 24px, transparent 25px),
        linear-gradient(transparent 23px, var(--grid-faint) 24px, transparent 25px),
        var(--bg);
      background-size: 24px 24px;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 max(28px, env(safe-area-inset-bottom));
    }
    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 24px;
    }
    .intro h1 {
      max-width: 650px;
      margin: 0;
      font-family: ui-rounded, "Noto Sans SC", sans-serif;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.06;
      letter-spacing: -.04em;
    }
    .intro p {
      max-width: 390px;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 22px;
      align-items: start;
    }
    .stage {
      min-height: 520px;
      padding: clamp(14px, 2.6vw, 28px);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 26px 8px 26px 8px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .stage::before {
      content: "";
      width: 130px;
      height: 12px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      background: var(--tape);
      border-radius: 2px;
      pointer-events: none;
    }
    .empty {
      width: min(560px, 100%);
      text-align: center;
      padding: 42px 20px;
    }
    .empty-art {
      width: 220px;
      height: 166px;
      margin: 0 auto 28px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      transform: rotate(-2deg);
    }
    .empty-art span {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .empty-art span:nth-child(1), .empty-art span:nth-child(5), .empty-art span:nth-child(9) { background: var(--accent-soft); }
    .empty-art span:nth-child(4) { transform: translate(-10px, 6px) rotate(-7deg); background: var(--danger-soft); }
    .empty-art span:nth-child(8) { transform: translate(10px, -5px) rotate(8deg); }
    .empty h2 { margin: 0 0 10px; font-size: 24px; }
    .empty p { margin: 0 auto 24px; color: var(--muted); line-height: 1.7; }
    .primary, .secondary, .icon-btn {
      border: 0;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 19px;
      color: #fff;
      background: var(--accent);
      border-radius: 12px 4px 12px 4px;
      font-weight: 700;
      box-shadow: 0 7px 0 var(--button-shadow);
    }
    .primary:hover { background: var(--accent-strong); transform: translateY(-1px); }
    .primary:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--button-shadow); }
    .secondary {
      min-height: 42px;
      padding: 0 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      font-weight: 600;
    }
    .secondary:hover { background: var(--accent-soft); }
    button:focus, label:focus-within { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
    button:focus:not(:focus-visible) { outline: none; }
    button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
    input[type="file"] { position: fixed; left: -9999px; }
    .panel {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px 22px 8px 22px;
      box-shadow: var(--shadow);
    }
    .panel-section + .panel-section { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
    .section-label { margin: 0 0 11px; font-size: 14px; font-weight: 700; }
    .difficulty { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .difficulty button {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      cursor: pointer;
      font-weight: 700;
    }
    .difficulty button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: white; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { padding: 11px; background: var(--surface-2); border-radius: 8px; }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 3px; font-size: 21px; font-variant-numeric: tabular-nums; }
    .panel-actions { display: grid; gap: 10px; }
    .panel-actions .primary, .panel-actions .secondary { width: 100%; }
    .hint { margin: 11px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .game-view { width: 100%; display: none; }
    .game-view.visible { display: block; }
    .game-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .game-topbar.visible { display: flex; }
    .game-status { color: var(--muted); font-size: 14px; }
    .game-status strong { color: var(--ink); }
    .image-meta { margin-left: 7px; white-space: nowrap; }
    .board-wrap { display: grid; place-items: center; position: relative; }
    .puzzle-board {
      width: min(100%, calc(62vh * var(--ratio, 1)));
      height: min(62vh, 720px);
      max-width: 720px;
      max-height: 720px;
      display: grid;
      grid-template-columns: repeat(var(--size, 3), 1fr);
      aspect-ratio: var(--ratio, 1);
      gap: 0;
      padding: 3px;
      background: var(--ink);
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .2);
      touch-action: manipulation;
    }
    .tile {
      position: relative;
      min-width: 0;
      border: 1px solid var(--ink);
      padding: 0;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: filter .14s ease, box-shadow .14s ease;
    }
    .tile:hover { filter: brightness(1.06); }
    .tile.selected { z-index: 2; filter: brightness(1.09); box-shadow: inset 0 0 0 4px var(--selected); }
    .tile.correct::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 2px var(--correct);
      pointer-events: none;
    }
    .tile-number {
      position: absolute;
      top: 5px;
      left: 5px;
      display: none;
      min-width: 24px;
      height: 24px;
      place-items: center;
      padding: 0 5px;
      border-radius: 4px;
      color: #fff;
      background: rgba(10, 16, 14, .78);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }
    .show-numbers .tile-number { display: grid; }
    .preview {
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: var(--surface);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,.24));
    }
    .preview.visible { opacity: 1; }
    .mobile-tools { display: none; gap: 8px; margin-top: 14px; }
    .mobile-tools button { flex: 1; }
    .finish {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(6, 15, 12, .68);
    }
    .finish.visible { display: grid; }
    .finish-card {
      width: min(420px, 100%);
      padding: 32px;
      text-align: center;
      background: var(--surface);
      border-radius: 24px 8px 24px 8px;
      box-shadow: 0 30px 80px rgba(0,0,0,.32);
      animation: pop .3s ease-out;
    }
    .finish-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      font-size: 36px;
      font-weight: 800;
    }
    .finish h2 { margin: 0 0 8px; font-size: 28px; }
    .finish p { margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
    .finish-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } }
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 30;
      transform: translate(-50%, 20px);
      padding: 11px 16px;
      color: #fff;
      background: #26302c;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .stage.dragging { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
    .loading-mask {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      place-items: center;
      background: rgba(255, 253, 248, .92);
    }
    .loading-mask.visible { display: grid; }
    .loading-card { text-align: center; color: var(--ink); }
    .loading-card strong { display: block; margin-bottom: 7px; font-size: 17px; }
    .loading-card span { color: var(--muted); font-size: 13px; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) { .loading-mask { background: rgba(27, 36, 33, .94); } }
    .loading-note { margin-top: 14px; color: var(--muted); font-size: 13px; }
    @media (max-width: 780px) {
      .app { width: min(100% - 22px, 680px); padding-top: 18px; }
      .intro { display: block; margin-bottom: 16px; }
      .intro h1 { font-size: clamp(30px, 10vw, 45px); }
      .intro p { margin-top: 12px; }
      .workspace { display: block; }
      .stage { min-height: 390px; padding: 15px; border-radius: 20px 7px 20px 7px; }
      .panel { margin-top: 14px; padding: 16px; border-radius: 7px 18px 7px 18px; }
      .panel-section + .panel-section { margin-top: 16px; padding-top: 16px; }
      .panel .stats, .panel .panel-actions { display: none; }
      .mobile-tools { display: flex; }
      .puzzle-board { width: min(100%, calc(56vh * var(--ratio, 1))); padding: 2px; }
      .image-meta { display: none; }
      .empty { padding: 30px 8px; }
      .empty-art { width: 170px; height: 128px; margin-bottom: 22px; }
      .game-topbar { display: none; }
      .game-topbar.visible { display: flex; }
      .finish-card { padding: 28px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="intro" aria-labelledby="main-title">
      <h1 id="main-title">把一张照片，<br>重新拼完整。</h1>
      <p>上传原图后，从 4 × 4 起步。依次点击两块碎片即可交换位置，把照片重新拼完整。</p>
    </section>

    <div class="workspace">
      <section class="stage" id="dropZone" aria-label="拼图游戏区">
        <div class="empty" id="emptyState">
          <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <h2>先选一张喜欢的照片</h2>
          <p>保留原图比例与清晰度，支持 JPG、PNG、WebP 等常见格式，单张不超过 50 MB。图片只在当前页面中处理。</p>
          <label class="primary" for="photoInput" role="button" tabindex="0">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            上传照片
          </label>
        </div>

        <div class="loading-mask" id="loadingMask" aria-live="polite">
          <div class="loading-card"><div class="spinner" aria-hidden="true"></div><strong>正在生成拼图</strong><span>大尺寸照片可能需要几秒钟</span></div>
        </div>

        <div class="game-view" id="gameView">
          <div class="game-topbar" id="gameTopbar">
            <div class="game-status">移动 <strong id="movesMobile">0</strong> 次 · <strong id="timeMobile">00:00</strong><span class="image-meta" id="imageMeta"></span></div>
            <label class="secondary" for="photoInput" role="button" tabindex="0">换照片</label>
          </div>
          <div class="board-wrap">
            <div class="puzzle-board" id="board" role="grid" aria-label="可交换的照片拼图"></div>
            <img class="preview" id="preview" alt="完整照片预览" />
          </div>
          <div class="mobile-tools">
            <button class="secondary" type="button" data-preview>按住看原图</button>
            <button class="primary" type="button" data-shuffle>重新打散</button>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="游戏设置">
        <div class="panel-section">
          <p class="section-label">难度</p>
          <div class="difficulty" id="difficulty">
            <button type="button" data-size="4" aria-pressed="true">4 × 4</button>
            <button type="button" data-size="6" aria-pressed="false">6 × 6</button>
            <button type="button" data-size="8" aria-pressed="false">8 × 8</button>
          </div>
        </div>
        <div class="panel-section">
          <p class="section-label">进度</p>
          <div class="stats">
            <div class="stat"><span>移动</span><strong id="moves">0</strong></div>
            <div class="stat"><span>用时</span><strong id="time">00:00</strong></div>
          </div>
        </div>
        <div class="panel-section panel-actions">
          <button class="secondary" type="button" data-preview>按住查看原图</button>
          <button class="primary" type="button" data-shuffle>重新打散</button>
          <label class="secondary" for="photoInput" role="button" tabindex="0" style="display:grid;place-items:center;cursor:pointer">换一张照片</label>
          <p class="hint">玩法：先点一块碎片，再点另一块交换位置；黄色框表示已选中，绿色细框表示位置正确。</p>
        </div>
      </aside>
    </div>
    <input id="photoInput" type="file" accept="image/*" />
  </main>

  <div class="finish" id="finish" role="dialog" aria-modal="true" aria-labelledby="finishTitle">
    <div class="finish-card">
      <div class="finish-mark" aria-hidden="true">✓</div>
      <h2 id="finishTitle">拼好啦！</h2>
      <p id="finishText">你完成了这幅拼图。</p>
      <div class="finish-actions">
        <button class="secondary" id="closeFinish" type="button">看看成品</button>
        <button class="primary" type="button" data-shuffle>再玩一次</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';
      var input = document.getElementById('photoInput');
      var board = document.getElementById('board');
      var stage = document.getElementById('dropZone');
      var emptyState = document.getElementById('emptyState');
      var gameView = document.getElementById('gameView');
      var gameTopbar = document.getElementById('gameTopbar');
      var preview = document.getElementById('preview');
      var loadingMask = document.getElementById('loadingMask');
      var finish = document.getElementById('finish');
      var finishText = document.getElementById('finishText');
      var toast = document.getElementById('toast');
      var imageMeta = document.getElementById('imageMeta');
      var size = 4;
      var imageUrl = '';
      var pieces = [];
      var selectedIndex = null;
      var moves = 0;
      var seconds = 0;
      var timer = null;
      var started = false;
      var startedAt = 0;
      var toastTimer = null;
      var loadSerial = 0;
      var gameVersion = 0;
      var pendingImageUrl = '';
      var pendingLoadTimer = null;
      var isLoadingImage = false;
      var naturalRatio = 1;
      var resizeTimer = null;
      var urlApi = window.URL || window.webkitURL;

      function eachNode(list, callback) {
        for (var i = 0; i < list.length; i++) callback(list[i], i);
      }

      function isInteger(value) {
        return typeof value === 'number' && isFinite(value) && Math.floor(value) === value;
      }

      function closestMatch(element, selector, boundary) {
        while (element && element !== boundary) {
          if (element.nodeType === 1) {
            var matcher = element.matches || element.webkitMatchesSelector || element.msMatchesSelector;
            if (matcher && matcher.call(element, selector)) return element;
          }
          element = element.parentNode;
        }
        return null;
      }

      function setClass(element, name, enabled) {
        if (enabled) element.classList.add(name);
        else element.classList.remove(name);
      }

      function twoDigits(value) {
        return value < 10 ? '0' + value : String(value);
      }

      function formatTime(value) {
        var minutes = Math.floor(value / 60);
        var secs = value % 60;
        return twoDigits(minutes) + ':' + twoDigits(secs);
      }

      function layoutBoard() {
        if (!imageUrl || !board.parentNode) return;
        var availableWidth = board.parentNode.clientWidth || stage.clientWidth || 720;
        var heightRatio = window.innerWidth <= 780 ? .56 : .62;
        var availableHeight = Math.min(720, Math.max(260, Math.floor(window.innerHeight * heightRatio)));
        var width = Math.min(720, availableWidth, availableHeight * naturalRatio);
        var height = width / naturalRatio;
        if (!isFinite(width) || !isFinite(height) || width <= 0 || height <= 0) return;
        board.style.width = Math.floor(width) + 'px';
        board.style.height = Math.floor(height) + 'px';
      }

      function updateStats() {
        document.getElementById('moves').textContent = moves;
        document.getElementById('movesMobile').textContent = moves;
        document.getElementById('time').textContent = formatTime(seconds);
        document.getElementById('timeMobile').textContent = formatTime(seconds);
      }

      function showToast(message, duration) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('visible'); }, duration || 2600);
      }

      function stopTimer() {
        if (started) seconds = Math.floor((Date.now() - startedAt) / 1000);
        if (timer) clearInterval(timer);
        timer = null;
        started = false;
        updateStats();
      }

      function runTimerInterval() {
        if (timer || !started || !imageUrl) return;
        timer = setInterval(function () {
          seconds = Math.floor((Date.now() - startedAt) / 1000);
          updateStats();
        }, 500);
      }

      function startTimer() {
        if (!imageUrl) return;
        if (!started) {
          started = true;
          startedAt = Date.now() - seconds * 1000;
        }
        runTimerInterval();
      }

      function suspendTimer() {
        if (started) seconds = Math.floor((Date.now() - startedAt) / 1000);
        if (timer) clearInterval(timer);
        timer = null;
        updateStats();
      }

      function isSolved() {
        return pieces.every(function (piece, index) { return piece === index; });
      }

      function makeShuffle(total) {
        var next = [];
        for (var index = 0; index < total; index++) next.push(index);
        for (var i = next.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = next[i]; next[i] = next[j]; next[j] = temp;
        }
        if (next.every(function (piece, index) { return piece === index; }) && total > 1) {
          var first = next[0]; next[0] = next[1]; next[1] = first;
        }
        return next;
      }

      function updateTile(position) {
        var tile = board.children[position];
        if (!tile) return;
        var piece = pieces[position];
        var row = Math.floor(piece / size);
        var col = piece % size;
        var isCorrect = piece === position;
        var isSelected = selectedIndex === position;
        setClass(tile, 'correct', isCorrect);
        setClass(tile, 'selected', isSelected);
        tile.setAttribute('aria-label', '拼图块 ' + (piece + 1) + (isCorrect ? '，位置正确' : '') + (isSelected ? '，已选中' : ''));
        tile.style.backgroundPosition = ((col / (size - 1)) * 100) + '% ' + ((row / (size - 1)) * 100) + '%';
        tile.firstElementChild.textContent = piece + 1;
      }

      function focusTile(position) {
        var tile = board.children[position];
        if (!tile) return;
        try { tile.focus({ preventScroll: true }); }
        catch (error) { tile.focus(); }
      }

      function renderBoard(focusIndex) {
        var fragment = document.createDocumentFragment();
        board.textContent = '';
        board.style.setProperty('--size', size);
        pieces.forEach(function (piece, position) {
          var tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'tile';
          tile.setAttribute('role', 'gridcell');
          tile.style.backgroundImage = 'url("' + imageUrl.replace(/"/g, '%22') + '")';
          tile.style.backgroundSize = (size * 100) + '% ' + (size * 100) + '%';
          tile.dataset.position = position;
          var number = document.createElement('span');
          number.className = 'tile-number';
          tile.appendChild(number);
          fragment.appendChild(tile);
        });
        board.appendChild(fragment);
        pieces.forEach(function (_, position) { updateTile(position); });
        layoutBoard();
        if (isInteger(focusIndex)) focusTile(focusIndex);
      }

      function resetAndShuffle() {
        if (!imageUrl) { input.click(); return; }
        stopTimer();
        gameVersion += 1;
        seconds = 0;
        moves = 0;
        selectedIndex = null;
        pieces = makeShuffle(size * size);
        finish.classList.remove('visible');
        preview.classList.remove('visible');
        updateStats();
        renderBoard();
      }

      function handleTile(index) {
        if (!isInteger(index) || index < 0 || index >= pieces.length || isLoadingImage) return;
        startTimer();
        if (selectedIndex === null) {
          selectedIndex = index;
          updateTile(index);
          focusTile(index);
          return;
        }
        if (selectedIndex === index) {
          selectedIndex = null;
          updateTile(index);
          focusTile(index);
          return;
        }

        var firstIndex = selectedIndex;
        var firstPiece = pieces[firstIndex];
        pieces[firstIndex] = pieces[index];
        pieces[index] = firstPiece;
        selectedIndex = null;
        moves += 1;
        updateStats();
        updateTile(firstIndex);
        updateTile(index);
        focusTile(index);
        if (isSolved()) {
          stopTimer();
          var solvedVersion = gameVersion;
          setTimeout(function () {
            if (solvedVersion !== gameVersion || !isSolved()) return;
            finishText.textContent = '用时 ' + formatTime(seconds) + '，移动了 ' + moves + ' 次。';
            finish.classList.add('visible');
            document.getElementById('closeFinish').focus();
          }, 250);
        }
      }

      function cancelPendingImageLoad() {
        loadSerial += 1;
        if (pendingLoadTimer) clearTimeout(pendingLoadTimer);
        pendingLoadTimer = null;
        if (pendingImageUrl && urlApi) urlApi.revokeObjectURL(pendingImageUrl);
        pendingImageUrl = '';
        isLoadingImage = false;
        loadingMask.classList.remove('visible');
        stage.removeAttribute('aria-busy');
      }

      function finishImageLoadState(url) {
        if (pendingImageUrl === url) pendingImageUrl = '';
        if (pendingLoadTimer) clearTimeout(pendingLoadTimer);
        pendingLoadTimer = null;
        isLoadingImage = false;
        loadingMask.classList.remove('visible');
        stage.removeAttribute('aria-busy');
      }

      function loadImage(file) {
        if (!file) return;
        cancelPendingImageLoad();
        var serial = loadSerial;
        var looksLikeImage = !file.type || /^image\//i.test(file.type) || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(file.name || '');
        if (!looksLikeImage) {
          showToast('请选择一张照片文件');
          return;
        }
        if (!file.size) {
          showToast('这张照片是空文件，请重新选择');
          return;
        }
        if (file.size > 50 * 1024 * 1024) {
          showToast('为保证稳定，请选择 50 MB 以内的照片');
          return;
        }
        if (!urlApi || !urlApi.createObjectURL) {
          showToast('当前浏览器版本过旧，请在微信右上角选择“在浏览器打开”', 4200);
          return;
        }
        var url;
        try { url = urlApi.createObjectURL(file); }
        catch (error) {
          showToast('无法读取这张照片，请重新选择');
          return;
        }
        var img = new Image();
        var settled = false;
        pendingImageUrl = url;
        isLoadingImage = true;
        loadingMask.classList.add('visible');
        stage.setAttribute('aria-busy', 'true');
        pendingLoadTimer = setTimeout(function () {
          if (settled) return;
          settled = true;
          urlApi.revokeObjectURL(url);
          if (serial !== loadSerial) return;
          finishImageLoadState(url);
          showToast('照片读取超时，请换一张或缩小文件后重试', 3600);
        }, 20000);
        showToast('正在读取原图…', 20000);
        img.decoding = 'async';
        img.onload = function () {
          if (settled) return;
          settled = true;
          if (serial !== loadSerial) { urlApi.revokeObjectURL(url); return; }
          finishImageLoadState(url);
          if (!img.naturalWidth || !img.naturalHeight || !isFinite(img.naturalWidth / img.naturalHeight)) {
            urlApi.revokeObjectURL(url);
            showToast('这张照片没有可用的画面尺寸');
            return;
          }
          var oldUrl = imageUrl;
          imageUrl = url;
          var ratio = img.naturalWidth / img.naturalHeight;
          naturalRatio = ratio;
          board.style.setProperty('--ratio', String(ratio));
          preview.src = url;
          imageMeta.textContent = ' · 原图 ' + img.naturalWidth + ' × ' + img.naturalHeight;
          emptyState.style.display = 'none';
          gameView.classList.add('visible');
          gameTopbar.classList.add('visible');
          resetAndShuffle();
          setTimeout(layoutBoard, 0);
          if (oldUrl) setTimeout(function () { urlApi.revokeObjectURL(oldUrl); }, 0);
          showToast('已按原图比例生成 ' + size + ' × ' + size + ' 拼图');
        };
        img.onerror = function () {
          if (settled) return;
          settled = true;
          urlApi.revokeObjectURL(url);
          if (serial !== loadSerial) return;
          finishImageLoadState(url);
          showToast('浏览器无法读取这张图片，请换用 JPG、PNG 或 WebP');
        };
        img.src = url;
      }

      input.addEventListener('change', function () {
        if (input.files && input.files[0]) loadImage(input.files[0]);
        input.value = '';
      });

      board.addEventListener('click', function (event) {
        var tile = closestMatch(event.target, '.tile', board);
        if (!tile || !board.contains(tile)) return;
        handleTile(Number(tile.dataset.position));
      });

      document.getElementById('difficulty').addEventListener('click', function (event) {
        var difficulty = document.getElementById('difficulty');
        var button = closestMatch(event.target, '[data-size]', difficulty);
        if (!button) return;
        size = Number(button.getAttribute('data-size'));
        eachNode(document.querySelectorAll('[data-size]'), function (item) {
          item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
        });
        if (imageUrl) {
          resetAndShuffle();
          showToast('已切换为 ' + size + ' × ' + size + ' 难度');
        }
      });

      eachNode(document.querySelectorAll('[data-shuffle]'), function (button) {
        button.addEventListener('click', resetAndShuffle);
      });

      function showPreview() { if (imageUrl) preview.classList.add('visible'); }
      function hidePreview() { preview.classList.remove('visible'); }
      window.addEventListener('blur', hidePreview);
      document.addEventListener('visibilitychange', function () { if (document.hidden) hidePreview(); });
      eachNode(document.querySelectorAll('[data-preview]'), function (button) {
        button.addEventListener('pointerdown', showPreview);
        button.addEventListener('pointerup', hidePreview);
        button.addEventListener('pointercancel', hidePreview);
        button.addEventListener('pointerleave', hidePreview);
        button.addEventListener('touchstart', showPreview);
        button.addEventListener('touchend', hidePreview);
        button.addEventListener('touchcancel', hidePreview);
        button.addEventListener('mousedown', showPreview);
        button.addEventListener('mouseup', hidePreview);
        button.addEventListener('mouseleave', hidePreview);
        button.addEventListener('keydown', function (event) { if (event.key === ' ' || event.key === 'Enter') showPreview(); });
        button.addEventListener('keyup', hidePreview);
      });

      function hasFileDrag(types) {
        if (!types) return false;
        for (var i = 0; i < types.length; i++) if (types[i] === 'Files') return true;
        return false;
      }

      ['dragenter', 'dragover'].forEach(function (name) {
        stage.addEventListener(name, function (event) {
          if (!event.dataTransfer || !hasFileDrag(event.dataTransfer.types)) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = 'copy';
          stage.classList.add('dragging');
        });
      });
      ['dragleave', 'drop'].forEach(function (name) {
        stage.addEventListener(name, function (event) {
          if (name === 'drop') event.preventDefault();
          stage.classList.remove('dragging');
          if (name === 'drop' && event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0]) loadImage(event.dataTransfer.files[0]);
        });
      });
      document.addEventListener('paste', function (event) {
        if (!event.clipboardData || !event.clipboardData.items) return;
        for (var i = 0; i < event.clipboardData.items.length; i++) {
          if (/^image\//.test(event.clipboardData.items[i].type)) {
            var pasted = event.clipboardData.items[i].getAsFile();
            if (pasted) loadImage(pasted);
            break;
          }
        }
      });

      document.getElementById('closeFinish').addEventListener('click', function () { finish.classList.remove('visible'); });
      finish.addEventListener('click', function (event) { if (event.target === finish) finish.classList.remove('visible'); });
      document.addEventListener('keydown', function (event) { if (event.key === 'Escape') finish.classList.remove('visible'); });

      eachNode(document.querySelectorAll('label[for="photoInput"]'), function (label) {
        label.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); input.click(); }
        });
      });

      function scheduleLayout() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layoutBoard, 80);
      }
      window.addEventListener('resize', scheduleLayout);
      window.addEventListener('orientationchange', scheduleLayout);

      window.addEventListener('pagehide', function (event) {
        hidePreview();
        if (event.persisted) {
          suspendTimer();
          return;
        }
        stopTimer();
        cancelPendingImageLoad();
        if (imageUrl && urlApi) urlApi.revokeObjectURL(imageUrl);
        imageUrl = '';
      });

      window.addEventListener('pageshow', function (event) {
        if (!event.persisted || !started || !imageUrl) return;
        startedAt = Date.now() - seconds * 1000;
        runTimerInterval();
      });
    })();
  </script>
</body>
</html>
